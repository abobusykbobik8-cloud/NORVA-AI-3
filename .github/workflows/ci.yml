name: ci

on:
  push:
  pull_request:
  workflow_dispatch:   # запуск вручную: вкладка Actions -> ci -> Run workflow

jobs:
  # Чистые JVM-модули: логика режимов, памяти, чата, загрузчик. Android SDK не нужен.
  jvm-tests:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ""
      ANDROID_SDK_ROOT: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - run: gradle :core-policy:test :core-inference:test :core-chat:test :core-vision:test --stacktrace
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports
          path: "**/build/reports/tests/test"
          if-no-files-found: ignore

  # Тест UTF-8 буфера и синтаксис JNI против заглушек. Совместимость с llama.cpp он НЕ доказывает.
  native-stub-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh native-check/run.sh

  # Настоящая проверка JNI-кода: компиляция (без линковки) против llama.h версии из llama.cpp.version и jni.h из JDK.
  llama-api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - run: sh scripts/fetch_llama.sh
      - run: sh native-check/verify_real_llama.sh third_party/llama.cpp

  # Сборка debug APK. Независима от остальных job, чтобы APK собирался даже при падении тестов.
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Компоненты Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - run: sh scripts/fetch_llama.sh
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - name: Сборка debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Контрольная сумма APK
        run: |
          ls -la app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/*.apk | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: norva-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  device-check:
    if: github.ref == 'refs/heads/release/1.4-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - name: Install emulator and native toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" "emulator" "system-images;android-35;google_apis;x86_64"
          sh scripts/fetch_llama.sh
      - name: Run on an Android 15 emulator
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd -n norva -k "system-images;android-35;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -avd norva -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          trap 'adb emu kill || true' EXIT
          timeout 360 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do sleep 3; done'
          adb shell input keyevent 82
          gradle -Pnorva.emulator=true :app:connectedDebugAndroidTest
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-device-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
